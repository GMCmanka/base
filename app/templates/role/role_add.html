<!DOCTYPE html>
<html lang="en">
{% include 'layouts/head.html' %}

<head>
<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #f4f6f9;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: #fff;
        border-radius: 12px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
    }

    .card:hover {
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    h2 {
        font-weight: 700;
        margin-bottom: 10px;
        text-align: center;
        color: #333;
    }

    p.subtitle {
        text-align: center;
        color: #666;
        font-size: 0.95rem;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 5px;
        color: #555;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 6px rgba(102,126,234,0.3);
        outline: none;
    }

    select.form-control[multiple] {
        height: 120px;
    }

    .btn-primary {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        background: #667eea;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        background: #5a67d8;
        box-shadow: 0 5px 15px rgba(102,126,234,0.3);
    }

    @media (max-width: 576px) {
        .card {
            padding: 30px 20px;
        }
    }
</style>
</head>

<body>


{% block content %}
<div class="card col-md-6 offset-md-3">
    <div class="card-body">
        <h2 class="mb-3 text-center">Create New Role</h2>
        <p class="subtitle text-center">Fill in the form to add a new role</p>

        <form action="{{ url_for('role.role_add') }}" method="POST">
            <div class="form-group">
                <label for="name">Role Name</label>
                <input type="text" id="name" name="name" placeholder="Enter role name" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Enter description" class="form-control" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="permissions">Assign Permissions</label>
                <select id="permissions" name="permissions" class="form-control" multiple>
                    {% for perm in permissions %}
                        <option value="{{ perm.id }}">{{ perm.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create Role</button>
        </form>
    </div>
</div>
{% endblock %}


</body>
</html>
