<!DOCTYPE html>
<html lang="en">
{% include 'layouts/head.html' %}
<body class="bg-light text-dark">

<!-- Main Wrapper -->
<div class="main-wrapper">

    <!-- Header -->
    {% include 'layouts/header.html' %}
    <!-- /Header -->

    <!-- Sidebar -->
    {% include 'layouts/sidebar.html' %}
    <!-- /Sidebar -->

    <!-- Page Wrapper -->
    <div class="page-wrapper">

        <!-- Page Content -->
        <div class="content container-fluid d-flex justify-content-center align-items-center" style="min-height:100vh;">
            <div class="col-lg-7 col-md-9">

                <!-- Page Header -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Update Role</h2>
                    <p class="text-muted">Modify role information & permissions</p>
                </div>

                <!-- Form Card -->
                <div class="card shadow-lg border-0 rounded-4 glass-card">
                    <div class="card-body p-5">

                        <!-- 
                            FORM ACTION
                            → Waa inuu ku socdaa route sax ah oo qaata role_id
                            → POST method waa khasab haddii la update gareynayo 
                        -->
                        <form action="{{ url_for('role.role_edit', role_id=role.id) }}" method="POST">

                            <!-- Role Name -->
                            <!-- 
                                NAME waa inuu noqdaa "name" (NOT role_name) 
                                → Backend-ka (Flask request.form['name']) ayaa sidaa filanaya
                            -->
                            <div class="form-floating mb-4">
                                <input type="text" 
                                       class="form-control" 
                                       id="name" 
                                       name="name" 
                                       value="{{ role.name }}" 
                                       required>
                                <label for="name">Role Name</label>
                            </div>

                            <!-- Description -->
                            <div class="form-floating mb-4">
                                <textarea class="form-control" 
                                          id="description" 
                                          name="description" 
                                          style="height:100px;" 
                                          placeholder="Role description...">{{ role.description }}</textarea>
                                <label for="description">Description</label>
                            </div>

                            <!-- Permissions -->
                            <!-- 
                                NAME sax waa "permissions"
                                multiple attribute wuxuu kuu oggolaanayaa in permissions badan la xusho
                                Flask: request.form.getlist("permissions")
                            -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Assign Permissions</label>
                                <select id="permissions" name="permissions" class="form-select select2" multiple>
                                    {% for perm in permissions %}
                                        <option value="{{ perm.id }}" 
                                                {% if perm in role.permissions %}selected{% endif %}>
                                            {{ perm.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-gradient btn-lg rounded-pill">
                                    <i class="bi bi-save me-2"></i> Save Changes
                                </button>
                            </div>
                        </form>
                        <!-- /Role Update Form -->

                    </div>
                </div>
                <!-- /Form Card -->

            </div>
        </div>
        <!-- /Page Content -->

    </div>
    <!-- /Page Wrapper -->
</div>
<!-- /Main Wrapper -->


<!-- Scripts -->
<script src="{{ url_for('static', filename='assets/js/jquery-3.5.1.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/popper.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/bootstrap.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/jquery.slimscroll.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/select2.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/moment.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/bootstrap-datetimepicker.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/app.js')}}"></script>

<script>
    $(document).ready(function() {
        $('.select2').select2({
            placeholder: "Choose permissions...",
            width: '100%'
        });
    });
</script>

<style>
    /* Glass Effect */
    .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    /* Gradient Button */
    .btn-gradient {
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: #fff;
        border: none;
        transition: 0.3s;
    }
    .btn-gradient:hover {
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    /* Floating labels styling */
    .form-floating>.form-control:focus,
    .form-floating>.form-select:focus {
        border-color: #06b6d4;
        box-shadow: 0 0 0 0.2rem rgba(6,182,212,0.25);
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
        body {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
        }
        .form-control, .form-select {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1e293b;
            color: #fff;
        }
    }
</style>

</body>
</html>
