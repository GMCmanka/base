<!DOCTYPE html>
<html lang="en">
{% include 'layouts/head.html' %}
<body>
<div class="main-wrapper">
    {% include 'layouts/header.html' %}
    {% include 'layouts/sidebar.html' %}
    
    <div class="page-wrapper">
        <div class="content container-fluid">
            <div class="page-header">
                <div class="row align-items-center">
                    <div class="col">
                        <h3 class="page-title">Settings</h3>
                        <ul class="breadcrumb">
                            <li class="breadcrumb-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Settings</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fa fa-palette me-2"></i>Appearance</h5>
                        </div>
                        <div class="card-body">
                            <form action="{{ url_for('users.update_settings') }}" method="POST">
                                <div class="form-group">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="darkMode" name="dark_mode" {{ 'checked' if user.dark_mode }}>
                                        <label class="custom-control-label" for="darkMode">Dark Mode</label>
                                    </div>
                                    <small class="text-muted">Toggle dark/light theme</small>
                                </div>
                                <button type="submit" class="btn btn-primary"><i class="fa fa-save me-2"></i>Save Settings</button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fa fa-lock me-2"></i>Change Password</h5>
                        </div>
                        <div class="card-body">
                            <form action="{{ url_for('users.change_password') }}" method="POST">
                                <div class="form-group">
                                    <label>Current Password</label>
                                    <input type="password" class="form-control" name="current_password" required>
                                </div>
                                <div class="form-group">
                                    <label>New Password</label>
                                    <input type="password" class="form-control" name="new_password" required minlength="6">
                                </div>
                                <div class="form-group">
                                    <label>Confirm New Password</label>
                                    <input type="password" class="form-control" name="confirm_password" required>
                                </div>
                                <button type="submit" class="btn btn-warning"><i class="fa fa-key me-2"></i>Change Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='assets/js/jquery-3.5.1.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/popper.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/js/bootstrap.min.js')}}"></script>
<script src="{{ url_for('static', filename='assets/plugins/sweetalert/sweetalert.min.js')}}"></script>
<script>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            {% if category == 'success' %}
                swal("Success!", "{{ message }}", "success");
            {% else %}
                swal("Error!", "{{ message }}", "error");
            {% endif %}
        {% endfor %}
    {% endif %}
{% endwith %}
</script>
</body>
</html>
