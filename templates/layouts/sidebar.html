<div class="sidebar" id="sidebar">
    <div class="sidebar-inner slimscroll">
        <div id="sidebar-menu" class="sidebar-menu">
            <ul>
                <li class="menu-title">
                    <span>Main</span>
                </li>
                <li class="submenu open">
                    <a href="#" onclick="toggleSubmenu(this); return false;">
                        <i class="la la-dashboard"></i> 
                        <span>Dashboard</span> 
                        <span class="menu-arrow"></span>
                    </a>
                    <ul class="submenu-list" style="display: block;">
                        <li><a href="{{url_for('home')}}"><i class="la la-home"></i> Dashboard</a></li>
                        <li><a href="{{url_for('users.user_list')}}"><i class="la la-users"></i> Users</a></li>
                        <li><a href="{{url_for('roles.role_list')}}"><i class="la la-shield"></i> Roles</a></li>
                    </ul>
                </li>
                <li class="menu-title">
                    <span>System</span>
                </li>
                <li class="submenu open">
                    <a href="#" onclick="toggleSubmenu(this); return false;">
                        <i class="la la-cog"></i> 
                        <span>Settings</span> 
                        <span class="menu-arrow"></span>
                    </a>
                    <ul class="submenu-list" style="display: block;">
                        <li><a href="{{url_for('users.profile')}}"><i class="la la-user"></i> My Profile</a></li>
                        <li><a href="{{url_for('users.settings')}}"><i class="la la-gear"></i> Settings</a></li>
                        <li><a href="{{url_for('users.activity_log')}}"><i class="la la-history"></i> Activity Log</a></li>
                        <li><a href="{{url_for('users.export_csv')}}"><i class="la la-download"></i> Export CSV</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</div>

<script>
function toggleSubmenu(el) {
    var parent = el.parentElement;
    var submenu = parent.querySelector('.submenu-list');
    
    if (submenu.style.display === 'none' || submenu.style.display === '') {
        submenu.style.display = 'block';
        parent.classList.add('open');
    } else {
        submenu.style.display = 'none';
        parent.classList.remove('open');
    }
}

// Apply dark mode if enabled
{% if current_user.is_authenticated and current_user.dark_mode %}
document.body.classList.add('dark-mode');
{% endif %}
</script>
